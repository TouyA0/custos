[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "custos"
version = "0.1.0"
description = "Mascotte gardienne pour Hyprland, propulsée par Claude."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# PyGObject (GTK4) et gtk4-layer-shell viennent des paquets Arch
# (python-gobject, gtk4-layer-shell) : le venv est créé avec --system-site-packages.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
custos = "custos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
custos = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
