# Copier dans ~/.config/custos/config.toml et adapter.

[claude]
# Appelé via `claude -p` : utilise ton abonnement, pas de clé API.
model = "claude-opus-5-5"
timeout = 120  # secondes

[mascot]
# top-left | top-right | bottom-left | bottom-right
position = "bottom-right"
margin = 24  # pixels depuis le bord de l'écran
size = 96    # taille du sprite en pixels
sleep_after = 300  # secondes sans activité avant qu'elle s'endorme
outline = true     # halo clair autour d'elle, pour la voir sur un fond sombre
hide_in_fullscreen = true  # disparaît quand une fenêtre est en plein écran (vidéo, jeu…)
# sprites_dir = "~/mes-sprites"  # par défaut : assets/sprites du projet

[privacy]
# Classes Hyprland (`hyprctl activewindow -j`) dont Custos ne lit jamais le contenu.
blocked_classes = ["org.keepassxc.KeePassXC", "Bitwarden"]

[shell]
# La mascotte réagit (localement, sans appeler Claude) quand une commande échoue.
react_on_failure = true

[notice]
# Custos remarque (localement, sans appeler Claude) ce que tu pourrais vouloir lui
# montrer : un badge s'allume sur la mascotte, un clic ouvre la bulle avec ce contenu.
selection = true    # texte sélectionné
images = true       # image copiée dans le presse-papier
screenshots = true  # capture de zone caelestia (SUPER + SHIFT + S)
screenshot_glob = "/tmp/caelestia-picker-*.png"
duration = 10       # secondes d'affichage du badge
