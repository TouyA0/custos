# Custos : à ajouter dans la section [key-bindings] de ~/.config/foot/foot.ini.
# Après une commande en échec, Custos envoie ce raccourci au terminal (via Hyprland,
# même sans le focus) : foot transmet alors la sortie de la dernière commande à Custos.
# Il faut aussi `capture_output = true` dans la section [shell] de la config de Custos.
# fish (>= 4) marque déjà le début et la fin de chaque sortie (OSC 133), rien d'autre à faire.
[key-bindings]
pipe-command-output=[sh -c "exec ~/.local/bin/custos shell-output"] Control+Shift+Mod1+F12
